<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MAMA League · Servidor do dia</title>
<style>
	body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #f4f5f7; color: #1d2330; }
	main { max-width: 460px; margin: 0 auto; padding: 48px 16px; }
	h1 { font-size: 28px; margin: 0 0 16px; }
	#estado { font-size: 17px; line-height: 1.4; margin: 0 0 20px; }
	.botao { display: inline-block; background: #2f6fd6; color: #fff; text-decoration: none; padding: 12px 20px; border-radius: 6px; font-size: 16px; margin: 0 8px 12px 0; }
	.botao[hidden] { display: none; }
	form { margin-top: 32px; padding-top: 20px; border-top: 1px solid #d5d9e0; }
	label { display: block; font-size: 15px; margin-bottom: 8px; }
	input { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; border: 1px solid #b8bfcc; border-radius: 6px; margin-bottom: 12px; }
	button { background: #1d2330; color: #fff; border: 0; padding: 10px 18px; border-radius: 6px; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<main>
	<h1>MAMA League</h1>
	<p id="estado">Procurando o servidor de hoje...</p>
	<a id="jogar" class="botao" href="jogar.html" hidden>Jogar</a>
	<a id="montar" class="botao" href="jogar.html?servidor=nenhum" hidden>Montar times</a>
	<form id="manual">
		<label for="endereco">Endereço do servidor de hoje</label>
		<input id="endereco" type="text" autocomplete="off" placeholder="exemplo.trycloudflare.com" />
		<button type="submit">Entrar</button>
	</form>
</main>
<script>
/*__SITE_SERVIDOR__*/
</script>
<script>
(function () {
	var ANUNCIO_URL = __ANUNCIO_URL__;
	var params = new URLSearchParams(location.search);
	var manual = params.get('manual') === '1';
	var query = params.get('servidor');
	var salvo = '';
	try { salvo = localStorage.getItem('mama_servidor') || ''; } catch (e) {}

	var estado = document.getElementById('estado');
	var jogar = document.getElementById('jogar');
	var montar = document.getElementById('montar');
	var form = document.getElementById('manual');
	var campo = document.getElementById('endereco');

	function comTempo(p, ms) {
		return Promise.race([p, new Promise(function (r) { setTimeout(function () { r(null); }, ms); })]);
	}
	function hora(ms) {
		var d = new Date(ms);
		return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
	}
	function irPara(host) {
		location.href = 'jogar.html?servidor=' + encodeURIComponent(host);
	}

	form.addEventListener('submit', function (ev) {
		ev.preventDefault();
		var host = campo.value.trim();
		if (host) irPara(host);
	});

	var busca = ANUNCIO_URL
		? comTempo(fetch(ANUNCIO_URL + '?acao=ver').then(function (r) { return r.json(); }).catch(function () { return null; }), 8000)
		: Promise.resolve(null);

	busca.then(function (anuncio) {
		var s = window.MamaServidor.escolherServidor({
			query: query && query !== 'nenhum' ? query : null,
			anuncio: anuncio,
			salvo: salvo,
			agora: Date.now()
		});
		if (query === 'nenhum' || !s.host) {
			estado.textContent = 'Nenhum servidor ligado agora';
			montar.hidden = false;
			return;
		}
		if (s.origem === 'anuncio') {
			estado.textContent = 'Servidor de hoje: ' + (s.quem || s.host) + ', ligado desde ' + hora(anuncio.desde);
		} else {
			estado.textContent = 'Servidor de hoje: ' + s.host;
		}
		jogar.href = 'jogar.html?servidor=' + encodeURIComponent(s.host);
		jogar.hidden = false;
		if (!manual) {
			estado.textContent += '. Abrindo em 2 s...';
			setTimeout(function () { irPara(s.host); }, 2000);
		}
	});
})();
</script>
</body>
</html>
